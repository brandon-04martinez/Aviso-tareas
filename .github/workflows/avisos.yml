# Guárdalo en tu repositorio como: .github/workflows/avisos.yml
name: Avisos Moodle

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas (hora UTC)
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write            # para guardar state.json

concurrency:
  group: avisos-moodle
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests icalendar

      - name: Revisar Moodle y avisar
        env:
          MOODLE_ICS_URL: ${{ secrets.MOODLE_ICS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python moodle_ntfy.py

      - name: Guardar estado
        run: |
          git config user.name "avisos-bot"
          git config user.email "avisos-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Actualizar estado" && git push)
